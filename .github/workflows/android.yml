name: Android APK et mises à jour
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - 'src/**'
      - 'scripts/**'
      - 'package*.json'
      - 'vite.config.ts'
      - '.github/workflows/android.yml'
permissions:
  contents: write
concurrency:
  group: android-stable
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Restaurer la signature fixe et numéroter la version
        env:
          ANDROID_SIGNING_BUNDLE: ${{ secrets.ANDROID_SIGNING_BUNDLE }}
        run: |
          node scripts/restore-android-signing.mjs
          echo "ANDROID_VERSION_CODE=$((100000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          echo "ANDROID_VERSION_NAME=1.1.$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - run: npm ci
      - run: npm run test:api
      - run: npm run mobile:android
      - run: npm run check:mobile
      - name: Compiler et vérifier l’APK signé
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/Tiffy.apk"
      - name: Publier la mise à jour
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sha256sum Tiffy.apk > Tiffy.apk.sha256
          tag="android-$ANDROID_VERSION_CODE"
          printf 'Version Android %s. Télécharger Tiffy.apk puis confirmer la mise à jour dans Android.\n' "$ANDROID_VERSION_NAME" > release-notes.txt
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Cette version est déjà publiée."
          else
            gh release create "$tag" Tiffy.apk Tiffy.apk.sha256 --target "$GITHUB_SHA" --title "Tiffy $ANDROID_VERSION_NAME" --notes-file release-notes.txt --latest
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: tiffy-android-signed
          path: |
            Tiffy.apk
            Tiffy.apk.sha256
          if-no-files-found: error
