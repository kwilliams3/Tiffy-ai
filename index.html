<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Titre -->
    <title>Tiffy | Assistant IA Personnel</title>

    <!-- Description -->
    <meta
      name="description"
      content="Tiffy est un assistant IA personnel intelligent, conçu pour répondre à tes questions et t'accompagner au quotidien."
    />

    <!-- Auteur -->
    <meta name="author" content="Tiffy AI" />

    <!-- Favicons -->
    <link rel="icon" type="image/png" sizes="32x32" href="/tiffy-icon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/tiffy-icon-192.png" />
    <link rel="apple-touch-icon" href="/tiffy-icon-192.png" />

    <!-- PWA -->
    <meta name="theme-color" content="#14b8a6" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Tiffy" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Open Graph (Facebook, WhatsApp, LinkedIn) -->
    <meta property="og:title" content="Tiffy | Assistant IA Personnel" />
    <meta
      property="og:description"
      content="Découvre Tiffy, ton assistant IA intelligent, toujours prêt à t'aider."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/tiffy-icon-512.png" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Tiffy | Assistant IA Personnel" />
    <meta
      name="twitter:description"
      content="Tiffy est ton assistant IA personnel, rapide, intelligent et toujours disponible."
    />
    <meta name="twitter:image" content="/tiffy-icon-512.png" />
  </head>

    <div id="root"></div>
